<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Samanda Clicker</title>
    <!-- Telegram WebApp SDK (обязательно до основного скрипта) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #0a0f1e, #03050b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 12px;
            padding-top: calc(12px + env(safe-area-inset-top));
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 580px;
            width: 100%;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(100, 210, 255, 0.3);
            border-radius: 56px;
            padding: 24px 20px 30px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 255, 0.1) inset, 0 0 40px rgba(0, 180, 255, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 6px;
            gap: 10px;
        }

        .balance-box {
            background: linear-gradient(145deg, #0f1a2f, #0b121f);
            padding: 12px 20px;
            border-radius: 80px;
            border: 1px solid #2e4b7c;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3), inset 0 2px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .coin-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 10px gold);
        }

        .balance-amount {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffe57f, #ffb347, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            white-space: nowrap;
        }

        .balance-label {
            font-size: 12px;
            color: #8ba0c0;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .per-click-badge {
            background: #1e2e4a;
            border-radius: 40px;
            padding: 8px 14px;
            border: 1px solid #4f7eb3;
            font-weight: 600;
            color: #b0e0ff;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .per-click-badge span {
            color: #7ef0ff;
            font-weight: 800;
        }

        .click-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 12px 0 10px;
        }

        .samanda-coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #fff9c4, #ffd966, #cc9b1a);
            box-shadow: 0 0 0 8px rgba(255, 215, 0, 0.2), 0 0 50px #ffd966, 0 20px 30px rgba(0,0,0,0.6), inset 0 -10px 20px rgba(0,0,0,0.4), inset 0 10px 25px #fff9b0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 900;
            color: #1f1f1f;
            text-shadow: 0 0 15px #ffffff, 0 0 30px #ffd700;
            cursor: pointer;
            transition: 0.07s ease;
            margin: 0 auto 18px;
            border: 3px solid #ffec9e;
            letter-spacing: 3px;
            font-family: 'Poppins', sans-serif;
            animation: idlePulse 3s infinite;
        }

        .samanda-coin:active {
            transform: scale(0.92);
            box-shadow: 0 0 0 8px rgba(255, 215, 0, 0.4), 0 0 70px #ffd966, 0 10px 20px black;
        }

        @keyframes idlePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .tap-hint {
            color: #b0d4ff;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 1px;
            background: rgba(0, 150, 255, 0.1);
            padding: 6px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0 16px;
        }

        .stat-card {
            background: rgba(10, 18, 36, 0.8);
            border: 1px solid #2f4a72;
            border-radius: 28px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 15px rgba(0, 180, 255, 0.1);
        }

        .stat-label {
            font-size: 11px;
            color: #8ba0c0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #c6e2ff;
            text-shadow: 0 0 15px #0099ff;
            margin-top: 4px;
        }

        .upgrades-section {
            background: rgba(6, 12, 24, 0.7);
            border-radius: 40px;
            padding: 18px 14px 10px;
            margin-top: 8px;
            border: 1px solid rgba(70, 150, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 30px rgba(0, 120, 255, 0.1);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b0e0ff;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 14px;
            padding-left: 8px;
            text-shadow: 0 0 10px #00a6ff;
        }

        .upgrade-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #101c2e;
            padding: 10px 16px;
            border-radius: 50px;
            margin-bottom: 10px;
            border: 1px solid #294a73;
            box-shadow: 0 5px 0 #050a12, 0 8px 15px black;
            gap: 10px;
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .upgrade-name {
            font-weight: 600;
            color: #e0f0ff;
            font-size: 15px;
        }

        .upgrade-desc {
            font-size: 11px;
            color: #8ba0c0;
            margin-top: 1px;
        }

        .upgrade-cost {
            font-size: 12px;
            color: #ffd966;
            font-weight: 600;
            margin-top: 2px;
        }

        .buy-btn {
            background: linear-gradient(145deg, #1e3a5f, #0e1c30);
            border: 1px solid #4699ff;
            color: #d0edff;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0b1422, 0 0 15px #0077ff;
            transition: 0.08s;
            letter-spacing: 0.5px;
            min-width: 84px;
            text-align: center;
            flex-shrink: 0;
        }

        .buy-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0b1422, 0 0 20px #0077ff;
        }

        .buy-btn:disabled {
            opacity: 0.45;
            box-shadow: 0 5px 0 #0b1422;
            filter: grayscale(0.7);
            pointer-events: none;
            border-color: #385b8a;
        }

        .buy-btn:not(:disabled):hover {
            background: #2e4e7a;
            border-color: #7fc9ff;
        }

        .footer-note {
            text-align: center;
            margin-top: 18px;
            color: #3c608a;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(145deg, #1e3a5f, #0e1c30);
            border: 1px solid #4699ff;
            color: #d0edff;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 25px rgba(0, 150, 255, 0.6);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 450px) {
            .game-container { padding: 18px 12px 20px; border-radius: 40px; }
            .balance-amount { font-size: 20px; }
            .coin-icon { font-size: 22px; }
            .balance-box { padding: 10px 14px; }
            .samanda-coin { width: 170px; height: 170px; font-size: 34px; }
            .per-click-badge { font-size: 12px; padding: 6px 10px; }
            .stat-value { font-size: 18px; }
            .upgrade-row { padding: 8px 10px; }
            .upgrade-name { font-size: 13px; }
            .buy-btn { padding: 7px 10px; font-size: 12px; min-width: 70px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="balance-box">
            <div class="coin-icon">🪙</div>
            <div>
                <div class="balance-label">SAMANDA</div>
                <div class="balance-amount" id="balanceDisplay">0</div>
            </div>
        </div>
        <div class="per-click-badge">
            ⚡ <span id="perClickDisplay">1</span>
        </div>
    </div>

    <div class="click-area">
        <div class="samanda-coin" id="coinButton">S</div>
        <div class="tap-hint">👆 ТАПАЙ</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">В СЕКУНДУ</div>
            <div class="stat-value" id="incomePerSecDisplay">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">ВСЕГО ТАПОВ</div>
            <div class="stat-value" id="totalTapsDisplay">0</div>
        </div>
    </div>

    <div class="upgrades-section">
        <div class="section-title"><span>⚡ УЛУЧШЕНИЯ</span></div>

        <div class="upgrade-row">
            <div class="upgrade-info">
                <div class="upgrade-name">➕ Сила тапа</div>
                <div class="upgrade-desc" id="tapUpgradeDesc">+1 к силе нажатия</div>
                <div class="upgrade-cost" id="tapUpgradeCost">Цена: 10</div>
            </div>
            <button class="buy-btn" id="buyTapUpgrade">КУПИТЬ</button>
        </div>

        <div class="upgrade-row">
            <div class="upgrade-info">
                <div class="upgrade-name">🌙 Офлайн-доход</div>
                <div class="upgrade-desc" id="idleUpgradeDesc">+0.5 / сек пассивно</div>
                <div class="upgrade-cost" id="idleUpgradeCost">Цена: 25</div>
            </div>
            <button class="buy-btn" id="buyIdleUpgrade">КУПИТЬ</button>
        </div>

        <div class="upgrade-row">
            <div class="upgrade-info">
                <div class="upgrade-name">🌟 Множитель офлайна</div>
                <div class="upgrade-desc" id="multiplierDesc">×1.2 к пассивному доходу</div>
                <div class="upgrade-cost" id="multiplierCost">Цена: 100</div>
            </div>
            <button class="buy-btn" id="buyMultiplier">КУПИТЬ</button>
        </div>

        <div class="upgrade-row">
            <div class="upgrade-info">
                <div class="upgrade-name">🤖 Авто-тап</div>
                <div class="upgrade-desc" id="autoClickDesc">+1 тап в секунду</div>
                <div class="upgrade-cost" id="autoClickCost">Цена: 200</div>
            </div>
            <button class="buy-btn" id="buyAutoClick">КУПИТЬ</button>
        </div>
    </div>
    <div class="footer-note">SAMANDA • ПРОКАЧИВАЙ СВОЮ ИМПЕРИЮ</div>
</div>

<script>
(function () {
    'use strict';

    // ============ TELEGRAM SETUP ============
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        try { tg.setHeaderColor('#03050b'); } catch (e) {}
        try { tg.setBackgroundColor('#03050b'); } catch (e) {}
    }

    const CLOUD_AVAILABLE = !!(tg && tg.CloudStorage);
    const SAVE_KEY = 'samanda_save_v1';
    const OFFLINE_CAP_SECONDS = 8 * 3600; // максимум 8 часов офлайн-дохода

    // ============ СОСТОЯНИЕ ============
    let balance = 0;
    let perClick = 1;
    let idleIncome = 0;
    let idleMultiplier = 1;
    let autoClickPerSec = 0;
    let totalTaps = 0;

    let tapLevel = 0;
    let idleLevel = 0;
    let multiplierLevel = 0;
    let autoClickLevel = 0;

    let lastSaved = Date.now();

    const BASE_TAP_COST = 10;
    const BASE_IDLE_COST = 25;
    const BASE_MULT_COST = 100;
    const BASE_AUTO_COST = 200;

    // ============ DOM ============
    const $ = (id) => document.getElementById(id);
    const balanceDisplay = $('balanceDisplay');
    const perClickDisplay = $('perClickDisplay');
    const incomePerSecDisplay = $('incomePerSecDisplay');
    const totalTapsDisplay = $('totalTapsDisplay');
    const coinButton = $('coinButton');

    const tapUpgradeCostSpan = $('tapUpgradeCost');
    const idleUpgradeCostSpan = $('idleUpgradeCost');
    const multiplierCostSpan = $('multiplierCost');
    const autoClickCostSpan = $('autoClickCost');

    const tapUpgradeDesc = $('tapUpgradeDesc');
    const idleUpgradeDesc = $('idleUpgradeDesc');
    const multiplierDesc = $('multiplierDesc');
    const autoClickDesc = $('autoClickDesc');

    const buyTapBtn = $('buyTapUpgrade');
    const buyIdleBtn = $('buyIdleUpgrade');
    const buyMultBtn = $('buyMultiplier');
    const buyAutoBtn = $('buyAutoClick');

    // ============ ФОРМАТИРОВАНИЕ ============
    function formatNumber(num) {
        if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
        if (num >= 1e4) return (num / 1e3).toFixed(1) + 'K';
        return Math.floor(num).toString();
    }

    // ============ РАСЧЁТЫ ============
    function getCurrentIdleIncomePerSec() {
        return idleIncome * idleMultiplier;
    }

    function getTotalIncomePerSec() {
        return getCurrentIdleIncomePerSec() + autoClickPerSec * perClick;
    }

    function getTapCost()      { return Math.floor(BASE_TAP_COST  * Math.pow(1.6, tapLevel)); }
    function getIdleCost()     { return Math.floor(BASE_IDLE_COST * Math.pow(1.8, idleLevel)); }
    function getMultCost()     { return Math.floor(BASE_MULT_COST * Math.pow(2.2, multiplierLevel)); }
    function getAutoCost()     { return Math.floor(BASE_AUTO_COST * Math.pow(1.9, autoClickLevel)); }

    // ============ UI ============
    function updateUI() {
        balanceDisplay.textContent = formatNumber(balance);
        perClickDisplay.textContent = formatNumber(perClick);
        incomePerSecDisplay.textContent = formatNumber(getTotalIncomePerSec());
        totalTapsDisplay.textContent = formatNumber(totalTaps);

        const tapCost = getTapCost();
        const idleCost = getIdleCost();
        const multCost = getMultCost();
        const autoCost = getAutoCost();

        tapUpgradeCostSpan.textContent = `Цена: ${formatNumber(tapCost)}`;
        idleUpgradeCostSpan.textContent = `Цена: ${formatNumber(idleCost)}`;
        multiplierCostSpan.textContent = `Цена: ${formatNumber(multCost)}`;
        autoClickCostSpan.textContent = `Цена: ${formatNumber(autoCost)}`;

        tapUpgradeDesc.textContent = `+1 к силе (сейчас +${formatNumber(perClick)})`;
        idleUpgradeDesc.textContent = `+0.5 / сек (база ${idleIncome.toFixed(1)})`;
        multiplierDesc.textContent = `×1.2 к офлайну (x${idleMultiplier.toFixed(2)})`;
        autoClickDesc.textContent = `+1 тап/сек (сейчас ${autoClickPerSec})`;

        buyTapBtn.disabled = balance < tapCost;
        buyIdleBtn.disabled = balance < idleCost;
        buyMultBtn.disabled = balance < multCost;
        buyAutoBtn.disabled = balance < autoCost;
    }

    // ============ TOAST ============
    let toastTimeout = null;
    function showToast(text, duration = 3000) {
        let t = document.getElementById('gameToast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'gameToast';
            t.className = 'toast';
            document.body.appendChild(t);
        }
        t.textContent = text;
        // Рефлоу для анимации
        void t.offsetWidth;
        t.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => t.classList.remove('show'), duration);
    }

    // ============ СОХРАНЕНИЕ / ЗАГРУЗКА ============
    function getSaveObject() {
        return {
            balance,
            perClick,
            idleIncome,
            idleMultiplier,
            autoClickPerSec,
            totalTaps,
            tapLevel,
            idleLevel,
            multiplierLevel,
            autoClickLevel,
            lastSaved: Date.now()
        };
    }

    function applySaveObject(data) {
        if (!data || typeof data !== 'object') return;

        balance          = Number(data.balance)          || 0;
        perClick         = Number(data.perClick)         || 1;
        idleIncome       = Number(data.idleIncome)       || 0;
        idleMultiplier   = Number(data.idleMultiplier)   || 1;
        autoClickPerSec  = Number(data.autoClickPerSec)  || 0;
        totalTaps        = Number(data.totalTaps)        || 0;
        tapLevel         = Number(data.tapLevel)         || 0;
        idleLevel        = Number(data.idleLevel)        || 0;
        multiplierLevel  = Number(data.multiplierLevel)  || 0;
        autoClickLevel   = Number(data.autoClickLevel)   || 0;

        lastSaved = Number(data.lastSaved) || Date.now();

        // Офлайн-доход
        const secondsOffline = Math.min(
            Math.max(0, Math.floor((Date.now() - lastSaved) / 1000)),
            OFFLINE_CAP_SECONDS
        );
        const offlineEarn = secondsOffline * (idleIncome * idleMultiplier);
        if (offlineEarn > 0) {
            balance += offlineEarn;
            setTimeout(() => {
                showToast(`🌙 Офлайн-доход: +${formatNumber(offlineEarn)} SAMANDA`, 4000);
            }, 600);
        }
    }

    // ---- localStorage ----
    function saveLocal() {
        try {
            localStorage.setItem(SAVE_KEY, JSON.stringify(getSaveObject()));
        } catch (e) {
            console.warn('localStorage save error:', e);
        }
    }

    function loadLocal() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) applySaveObject(JSON.parse(raw));
        } catch (e) {
            console.warn('localStorage load error:', e);
        }
    }

    // ---- CloudStorage ----
    function saveCloud(cb) {
        if (!CLOUD_AVAILABLE) { if (cb) cb(); return; }
        try {
            tg.CloudStorage.setItem(SAVE_KEY, JSON.stringify(getSaveObject()), (err) => {
                if (err) console.warn('CloudStorage save error:', err);
                if (cb) cb();
            });
        } catch (e) {
            console.warn('CloudStorage save exception:', e);
            if (cb) cb();
        }
    }

    function loadCloud(cb) {
        if (!CLOUD_AVAILABLE) { if (cb) cb(false); return; }
        try {
            tg.CloudStorage.getItem(SAVE_KEY, (err, value) => {
                if (!err && value) {
                    try {
                        applySaveObject(JSON.parse(value));
                        if (cb) cb(true);
                        return;
                    } catch (e) {
                        console.warn('CloudStorage parse error:', e);
                    }
                }
                if (cb) cb(false);
            });
        } catch (e) {
            console.warn('CloudStorage load exception:', e);
            if (cb) cb(false);
        }
    }

    // Универсальное сохранение: и локально, и в облако
    function saveGame() {
        saveLocal();
        saveCloud();
    }

    // ============ ИГРОВЫЕ ДЕЙСТВИЯ ============
    function handleCoinClick(e) {
        if (e) e.preventDefault();
        balance += perClick;
        totalTaps += 1;
        updateUI();

        coinButton.style.transform = 'scale(0.92)';
        setTimeout(() => { coinButton.style.transform = ''; }, 70);
    }

    function buyTapUpgrade() {
        const cost = getTapCost();
        if (balance < cost) return;
        balance -= cost;
        tapLevel++;
        perClick += 1;
        updateUI();
        saveGame();
    }

    function buyIdleUpgrade() {
        const cost = getIdleCost();
        if (balance < cost) return;
        balance -= cost;
        idleLevel++;
        idleIncome += 0.5;
        updateUI();
        saveGame();
    }

    function buyMultiplier() {
        const cost = getMultCost();
        if (balance < cost) return;
        balance -= cost;
        multiplierLevel++;
        idleMultiplier *= 1.2;
        updateUI();
        saveGame();
    }

    function buyAutoClick() {
        const cost = getAutoCost();
        if (balance < cost) return;
        balance -= cost;
        autoClickLevel++;
        autoClickPerSec += 1;
        updateUI();
        saveGame();
    }

    // ============ ЦИКЛ ============
    function gameLoop() {
        const passive = getCurrentIdleIncomePerSec();
        if (passive > 0) balance += passive;

        if (autoClickPerSec > 0) {
            balance += autoClickPerSec * perClick;
            totalTaps += autoClickPerSec;
        }
        updateUI();
    }

    // ============ ОБРАБОТЧИКИ ============
    coinButton.addEventListener('click', handleCoinClick);
    coinButton.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleCoinClick(e);
    }, { passive: false });

    buyTapBtn.addEventListener('click', buyTapUpgrade);
    buyIdleBtn.addEventListener('click', buyIdleUpgrade);
    buyMultBtn.addEventListener('click', buyMultiplier);
    buyAutoBtn.addEventListener('click', buyAutoClick);

    // Автосохранение каждые 5 сек
    setInterval(saveGame, 5000);

    // Сохранение при уходе со страницы / скрытии вкладки
    window.addEventListener('beforeunload', saveGame);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) saveGame();
    });

    // Telegram: при закрытии приложения
    if (tg) {
        tg.onEvent('viewportChanged', saveGame);
    }

    // ============ ИНИЦИАЛИЗАЦИЯ ============
    function init() {
        // Приоритет: сначала cloud (в Telegram), иначе local
        if (CLOUD_AVAILABLE) {
            loadCloud((found) => {
                if (!found) {
                    // В облаке нет сохранения — пробуем локальное
                    loadLocal();
                }
                updateUI();
                // Если нашли что-то в облаке, синхронизируем локально
                if (found) saveLocal();
            });
        } else {
            loadLocal();
            updateUI();
        }

        // Запускаем игровой цикл
        setInterval(gameLoop, 1000);

        // Финальный updateUI на случай задержки loadCloud
        updateUI();
    }

    init();
})();
</script>
</body>
</html>
